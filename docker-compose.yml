version: "3.8"
services:
  db:
    container_name: lab44-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: lab44
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: lab44
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab44 -d lab44"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: lab44-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://lab44:${DB_PASSWORD:-password}@db:5432/lab44
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
